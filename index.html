<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="College Attendance Management System - Admin Login. Secure login portal for college administrators to manage student attendance." />
  <meta name="theme-color" content="#4f46e5" />
  <title>Admin Login | College Attendance System</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* Page-specific overrides */
    body.login-body {
      background: none;
    }
  </style>
</head>
<body class="login-body">

  <main class="login-page" id="loginPage">
    <div class="login-bg-pattern" aria-hidden="true"></div>

    <div class="login-card" role="main">

      <!-- Logo -->
      <div class="login-logo" aria-label="College Attendance System">
        <div class="login-logo-icon" aria-hidden="true">
          <!-- Graduation Cap Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
      </div>

      <h1 class="login-heading">Welcome Back</h1>
      <p class="login-subheading">Sign in to the College Attendance System</p>

      <!-- Login Form -->
      <form class="login-form" id="loginForm" novalidate>

        <!-- Email Field -->
        <div class="form-group">
          <label for="adminEmail" class="form-label">
            Admin Email
            <span class="required" aria-hidden="true">*</span>
          </label>
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input
              type="email"
              id="adminEmail"
              name="email"
              class="form-input"
              placeholder="admin@college.edu"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="emailError"
            />
          </div>
          <p class="form-error hidden" id="emailError" role="alert"></p>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="adminPassword" class="form-label">
            Password
            <span class="required" aria-hidden="true">*</span>
          </label>
          <div class="input-group icon-right" style="position: relative;">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="adminPassword"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="passwordError"
            />
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
              <!-- Eye Icon -->
              <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hidden">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <p class="form-error hidden" id="passwordError" role="alert"></p>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center gap-2" style="gap: 0.5rem; display: flex; align-items: center;">
          <input type="checkbox" id="rememberMe" name="remember" style="width:18px; height:18px; accent-color: var(--clr-primary); cursor: pointer;" />
          <label for="rememberMe" class="text-sm" style="cursor: pointer; color: var(--clr-text-secondary);">Remember me</label>
        </div>

        <!-- Error Alert -->
        <div class="alert alert-danger hidden" id="loginError" role="alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          <span id="loginErrorText">Invalid email or password.</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-lg btn-full" id="loginBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign In
        </button>

      </form>


      <p class="login-footer-note">
        &copy; 2024 College Attendance System. All rights reserved.
      </p>

    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <script src="js/dashboard.js" defer></script>
  <script>
    // ============================================================
    // index.html — Login Page Logic
    // TODO STEP 2: Replace this frontend-only auth with real backend authentication
    // ============================================================

    // Demo credentials (frontend only — replace in production)
    const DEMO_EMAIL    = 'admin@college.edu';
    const DEMO_PASSWORD = 'admin123';

    const loginForm     = document.getElementById('loginForm');
    const loginBtn      = document.getElementById('loginBtn');
    const loginError    = document.getElementById('loginError');
    const loginErrorText = document.getElementById('loginErrorText');
    const togglePassword = document.getElementById('togglePassword');
    const adminPassword  = document.getElementById('adminPassword');
    const eyeOpen        = document.getElementById('eyeOpen');
    const eyeClosed      = document.getElementById('eyeClosed');
    const emailError     = document.getElementById('emailError');
    const passwordError  = document.getElementById('passwordError');

    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
      const isText = adminPassword.type === 'text';
      adminPassword.type = isText ? 'password' : 'text';
      eyeOpen.classList.toggle('hidden', !isText);
      eyeClosed.classList.toggle('hidden', isText);
      togglePassword.setAttribute('aria-label', isText ? 'Show password' : 'Hide password');
    });

    // Form validation helpers
    function showError(el, msg) {
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function clearError(el) {
      el.textContent = '';
      el.classList.add('hidden');
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // Inline validation on blur
    document.getElementById('adminEmail').addEventListener('blur', function () {
      if (!this.value.trim()) {
        showError(emailError, 'Email is required.');
      } else if (!validateEmail(this.value)) {
        showError(emailError, 'Please enter a valid email address.');
      } else {
        clearError(emailError);
      }
    });

    document.getElementById('adminPassword').addEventListener('blur', function () {
      if (!this.value) {
        showError(passwordError, 'Password is required.');
      } else {
        clearError(passwordError);
      }
    });

    // Form submit
    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const email    = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      let valid = true;

      // Clear previous errors
      clearError(emailError);
      clearError(passwordError);
      loginError.classList.add('hidden');

      // Validate
      if (!email) {
        showError(emailError, 'Email is required.');
        valid = false;
      } else if (!validateEmail(email)) {
        showError(emailError, 'Please enter a valid email address.');
        valid = false;
      }

      if (!password) {
        showError(passwordError, 'Password is required.');
        valid = false;
      }

      if (!valid) return;

      // Show loading state
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span> Signing in...';

      // Simulate authentication delay
      setTimeout(() => {
        // TODO STEP 2: Replace this with real API call
        // fetch('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) })
        if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
          // Store demo session
          sessionStorage.setItem('cas_admin', JSON.stringify({
            name: 'Admin User',
            email: email,
            role: 'Administrator',
            loginAt: new Date().toISOString()
          }));
          // Redirect to dashboard
          window.location.href = 'dashboard.html';
        } else {
          loginError.classList.remove('hidden');
          loginErrorText.textContent = 'Invalid email or password. Try admin@college.edu / admin123';
          loginBtn.disabled = false;
          loginBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Sign In`;
        }
      }, 800);
    });

    // Clear errors on input
    document.getElementById('adminEmail').addEventListener('input', () => clearError(emailError));
    document.getElementById('adminPassword').addEventListener('input', () => clearError(passwordError));
  </script>

</body>
</html>
